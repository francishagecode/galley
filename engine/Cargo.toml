[package]
name = "galley-engine"
version = "0.1.0"
description = "Typst compilation and page rendering for Galley, independent of the app shell"
authors = ["Francis Hage"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

typst = "0.14"
typst-svg = "0.14"
typst-ide = "0.14"
typst-pdf = "0.14"
typst-render = "0.14"
typst-html = "0.14"
typst-kit = { version = "0.14", default-features = false, features = [
    "embed-fonts",
    "packages",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
rayon = "1"
comemo = "0.4"
png = "0.18"
