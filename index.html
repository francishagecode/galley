<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galley</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <!-- Sidebar toggle -->
        <div class="toolbar-group">
          <button id="btn-sidebar" class="btn is-active" data-tip="Toggle outline" aria-label="Toggle outline">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
          </button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- File ops -->
        <div class="toolbar-group">
          <button id="btn-open-folder" class="btn" data-tip="Open folder  ⌘⇧O" aria-label="Open folder">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11h18"/></svg>
          </button>
          <button id="btn-open" class="btn" data-tip="Open file  ⌘O" aria-label="Open">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
          <button id="btn-save" class="btn" data-tip="Save  ⌘S" aria-label="Save">
            <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4"/><path d="M8 14h8v6H8z"/></svg>
          </button>
          <button id="btn-export" class="btn" data-tip="Export…  ⌘E" aria-label="Export">
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          </button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- Headings -->
        <div class="toolbar-group">
          <button id="btn-h1" class="btn text-glyph" data-tip="Heading 1" aria-label="Heading 1">H1</button>
          <button id="btn-h2" class="btn text-glyph" data-tip="Heading 2" aria-label="Heading 2">H2</button>
          <button id="btn-h3" class="btn text-glyph" data-tip="Heading 3" aria-label="Heading 3">H3</button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- Inline formatting -->
        <div class="toolbar-group">
          <button id="btn-bold" class="btn text-glyph" data-tip="Bold  ⌘B" aria-label="Bold"><b>B</b></button>
          <button id="btn-italic" class="btn text-glyph" data-tip="Italic  ⌘I" aria-label="Italic"><i>I</i></button>
          <button id="btn-strike" class="btn text-glyph" data-tip="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
          <button id="btn-underline" class="btn text-glyph" data-tip="Underline" aria-label="Underline"><u>U</u></button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- Lists / blocks -->
        <div class="toolbar-group">
          <button id="btn-list" class="btn" data-tip="Bullet list" aria-label="Bullet list">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.2" fill="currentColor" stroke="none"/><path d="M10 6h11M10 12h11M10 18h11"/></svg>
          </button>
          <button id="btn-numlist" class="btn" data-tip="Numbered list" aria-label="Numbered list">
            <svg viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 5l1.5-1v4"/><path d="M3 18h3M3 14h3l-3 4h3"/></svg>
          </button>
          <button id="btn-quote" class="btn" data-tip="Quote block" aria-label="Quote">
            <svg viewBox="0 0 24 24"><path d="M7 7c-2 0-3 1.5-3 4v6h5v-6H6c0-1.5.5-2 2-2zm10 0c-2 0-3 1.5-3 4v6h5v-6h-3c0-1.5.5-2 2-2z"/></svg>
          </button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- Code / math -->
        <div class="toolbar-group">
          <button id="btn-code" class="btn" data-tip="Inline code" aria-label="Inline code">
            <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>
          </button>
          <button id="btn-codeblock" class="btn" data-tip="Code block" aria-label="Code block">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 10l-2 2 2 2M15 10l2 2-2 2"/></svg>
          </button>
          <button id="btn-math-inline" class="btn text-glyph" data-tip="Inline math" aria-label="Inline math">$x$</button>
          <button id="btn-math-block" class="btn text-glyph" data-tip="Display math" aria-label="Display math">∑</button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- Embeds -->
        <div class="toolbar-group">
          <button id="btn-link" class="btn" data-tip="Link" aria-label="Link">
            <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5"/></svg>
          </button>
          <button id="btn-image" class="btn" data-tip="Image" aria-label="Image">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M3 17l5-4 4 3 4-3 5 4"/></svg>
          </button>
          <button id="btn-table" class="btn" data-tip="Table" aria-label="Table">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M3 15h18M12 5v14"/></svg>
          </button>
          <button id="btn-hr" class="btn" data-tip="Horizontal rule" aria-label="Rule">
            <svg viewBox="0 0 24 24"><path d="M3 12h18"/></svg>
          </button>
        </div>

        <div class="toolbar-group right">
          <div class="seg" id="view-mode-seg" role="tablist">
            <button data-mode="editor" data-tip="Editor only" aria-label="Editor only">Code</button>
            <button data-mode="both" class="is-active" data-tip="Split view" aria-label="Split view">Split</button>
            <button data-mode="preview" data-tip="Preview only" aria-label="Preview only">Preview</button>
          </div>
          <button id="btn-settings" class="btn" data-tip="Editor settings  ⌘," data-tip-pos="left" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <span id="status" class="status">Ready</span>
        </div>
      </header>

      <!-- Settings popover -->
      <div id="settings-panel" class="popover" hidden>
        <h4>Editor</h4>
        <div class="row">
          <label for="set-font">Font</label>
          <select id="set-font">
            <option value="ui-monospace, 'SF Mono', Menlo, monospace">System Mono</option>
            <option value="'JetBrains Mono', ui-monospace, monospace">JetBrains Mono</option>
            <option value="'Fira Code', ui-monospace, monospace">Fira Code</option>
            <option value="'IBM Plex Mono', ui-monospace, monospace">IBM Plex Mono</option>
            <option value="Menlo, ui-monospace, monospace">Menlo</option>
            <option value="Monaco, ui-monospace, monospace">Monaco</option>
            <option value="Consolas, ui-monospace, monospace">Consolas</option>
            <option value="'Cascadia Code', ui-monospace, monospace">Cascadia Code</option>
          </select>
        </div>
        <div class="row">
          <label for="set-size">Size</label>
          <input id="set-size" type="range" min="10" max="24" step="1" />
          <span class="value" id="set-size-val">14</span>
        </div>
        <div class="row">
          <label for="set-line">Line height</label>
          <input id="set-line" type="range" min="12" max="22" step="1" />
          <span class="value" id="set-line-val">1.6</span>
        </div>
        <div class="row">
          <label for="set-tab">Tab size</label>
          <input id="set-tab" type="range" min="2" max="8" step="1" />
          <span class="value" id="set-tab-val">2</span>
        </div>
        <hr/>
        <h4>Appearance</h4>
        <div class="row">
          <label for="set-theme">Color scheme</label>
          <select id="set-theme">
            <option value="mariana">Mariana</option>
            <option value="monokai">Monokai</option>
            <option value="slate">Slate</option>
            <option value="paper">Paper</option>
            <option value="solar">Solar</option>
          </select>
        </div>
        <div class="row">
          <label for="set-linenums">Line numbers</label>
          <div class="seg">
            <button id="set-linenums-on" class="is-active" data-on="1">On</button>
            <button id="set-linenums-off" data-on="0">Off</button>
          </div>
        </div>
        <hr/>
        <h4>Autosave</h4>
        <div class="row">
          <label for="set-autosave">Enabled</label>
          <div class="seg">
            <button id="set-autosave-on" class="is-active" data-on="1">On</button>
            <button id="set-autosave-off" data-on="0">Off</button>
          </div>
        </div>
        <div class="row">
          <label for="set-autosave-delay">Delay</label>
          <input id="set-autosave-delay" type="range" min="500" max="5000" step="500" />
          <span class="value" id="set-autosave-delay-val">1.0s</span>
        </div>
      </div>

      <!-- Export popover -->
      <div id="export-panel" class="popover" hidden>
        <h4>Export</h4>
        <div class="row">
          <label for="export-format">Format</label>
          <select id="export-format">
            <option value="pdf">PDF — single file</option>
            <option value="png">PNG — one per page</option>
            <option value="svg">SVG — one per page</option>
            <option value="html">HTML — single file</option>
          </select>
        </div>
        <div class="row" id="export-ppi-row" hidden>
          <label for="export-ppi">Resolution</label>
          <input id="export-ppi" type="range" min="72" max="300" step="12" />
          <span class="value" id="export-ppi-val">144 dpi</span>
        </div>
        <p class="export-note" id="export-note"></p>
        <div class="export-actions">
          <button id="export-go" class="export-btn">Export…</button>
        </div>
      </div>

      <main class="workspace">
        <aside id="sidebar" class="sidebar" aria-label="Project sidebar">
          <section class="sidebar-section sidebar-files">
            <div class="sidebar-header">
              <span class="sidebar-title" id="project-name">No project</span>
              <button id="btn-new-file" class="sidebar-action" data-tip="New file" data-tip-pos="left" aria-label="New file" hidden>
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <nav id="file-tree" class="file-tree"></nav>
            <div class="sidebar-empty" id="file-tree-empty">
              No project open. Use Open Folder to start a book.
            </div>
          </section>
          <div class="sidebar-divider"></div>
          <section class="sidebar-section sidebar-outline">
            <div class="sidebar-header">
              <span class="sidebar-title">Outline</span>
            </div>
            <nav id="sidebar-list" class="sidebar-list"></nav>
            <div class="sidebar-empty" id="sidebar-empty" hidden>
              No headings or page breaks yet.
            </div>
          </section>
        </aside>
        <div class="split view-both" id="split">
        <section id="editor" class="pane editor-pane"></section>
        <div id="resizer" class="resizer" data-tip="Drag to resize · double-click to reset" aria-label="Resize panes"></div>
        <section class="pane preview-pane">
          <div class="preview-toolbar">
            <button id="btn-zoom-out" class="btn" data-tip="Zoom out  ⌘−" aria-label="Zoom out">
              <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
            </button>
            <span id="zoom-level" class="zoom-level">100%</span>
            <button id="btn-zoom-in" class="btn" data-tip="Zoom in  ⌘+" aria-label="Zoom in">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="btn-zoom-reset" class="btn wide" data-tip="Reset zoom  ⌘0" aria-label="Reset zoom">100%</button>
            <button id="btn-zoom-fit" class="btn wide" data-tip="Fit to width" aria-label="Fit to width">Fit</button>
            <span style="flex:1"></span>
          </div>
          <div class="preview-scroll">
            <div id="preview" class="preview"></div>
            <pre id="error-box" class="error-box" hidden></pre>
          </div>
        </section>
        </div>
      </main>
    </div>
  </body>
</html>
