name: Release

# Builds Galley for Linux (x86_64), then publishes a draft GitHub Release with
# the AppImage and .deb. Triggered by pushing a tag that starts with "v"
# (e.g. v0.1.0).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build and package
        run: npm run dist -- --linux --publish never

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Galley ${{ github.ref_name }}"
          body: "See the assets to download and install Galley."
          draft: true
          files: |
            release/*.AppImage
            release/*.deb
